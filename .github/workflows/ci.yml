name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test wisp-decide (no model download, the tests use a fake model)
        run: PYTHONPATH=packages/wisp-decide/src python -m unittest discover -s packages/wisp-decide/tests -v

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test (CPU only; the CUDA kernels need a GPU and are tested locally)
        run: cargo test --release --features inference --manifest-path rust/Cargo.toml
